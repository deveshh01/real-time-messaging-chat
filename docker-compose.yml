services:
  db:
    image: postgres:16-alpine
    container_name: realtime-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    # Host port 5440 avoids clashing with a Postgres already on 5432.
    ports:
      - "5440:5432"
    volumes:
      - chat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chat-pgdata:
